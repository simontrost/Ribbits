pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'ribbits'
// 26.3 currently targets only Fabric. The legacy common sources are included in
// fabric/sourceSets to avoid running the old Architectury / NeoForge toolchain.
include 'fabric'
